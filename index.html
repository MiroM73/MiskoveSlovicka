<style>
/* Layout: one centered column, a tab switch, a step rail for the new words, one exercise card at a time */
:root{
  --bg:#eef3fa; --surface:#ffffff; --ink:#1c2433; --muted:#5a6578; --line:#d6dfec;
  --accent:#2a67d8; --accent-soft:#e3ecfc; --sun:#f3ad00; --sun-soft:#fff3cf;
  --ok:#17905a; --ok-soft:#ddf4e8; --bad:#cf3b3b; --bad-soft:#fbe4e4;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151e; --surface:#18202c; --ink:#e8eef8; --muted:#9ba7bb; --line:#2a3546;
  --accent:#6f9dff; --accent-soft:#1d2a44; --sun:#f2c14e; --sun-soft:#3a3016;
  --ok:#40c785; --ok-soft:#173527; --bad:#ff7070; --bad-soft:#3d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151e; --surface:#18202c; --ink:#e8eef8; --muted:#9ba7bb; --line:#2a3546;
  --accent:#6f9dff; --accent-soft:#1d2a44; --sun:#f2c14e; --sun-soft:#3a3016;
  --ok:#40c785; --ok-soft:#173527; --bad:#ff7070; --bad-soft:#3d1d1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,5vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.st{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);min-width:0}
.st b{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1;color:var(--ink)}
.st.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.st.done{border-color:var(--ok);background:var(--ok-soft)}
@media (max-width:520px){.rail{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card h2{font-family:var(--display);font-size:1.4rem;margin:0;line-height:1.2}
.hint{color:var(--muted);margin:0}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.4rem);text-align:center;line-height:1.15;padding:10px 0;overflow-wrap:anywhere}
.lbl{display:block;text-align:center;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-weight:700;font-size:1.05rem;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.sun{background:var(--sun);color:#1c2433}
.fb{border-radius:14px;padding:12px 14px;font-weight:700;text-align:center}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink)}
.flash{perspective:900px;cursor:pointer;border:none;background:none;padding:0;width:100%}
.flash .in{position:relative;min-height:190px;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;backface-visibility:hidden;padding:16px;font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,6vw,2.5rem);line-height:1.15;text-align:center;overflow-wrap:anywhere}
.face.f{background:var(--accent-soft);border:2px solid var(--accent)}
.face.b{background:var(--sun-soft);border:2px solid var(--sun);transform:rotateY(180deg)}
.face small{font-family:var(--body);font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.speak{border:3px solid var(--accent);background:var(--accent-soft);border-radius:999px;padding:14px 26px 14px 20px;margin:0 auto;display:flex;align-items:center;gap:12px;font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink)}
.speak:hover{background:var(--accent);color:#fff}
.speak:hover svg{fill:#fff}
.speak svg{width:44px;height:44px;fill:var(--accent);flex:none}
.btn svg{width:20px;height:20px;fill:currentColor;vertical-align:-4px;margin-right:6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:44px;height:48px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-family:var(--display);font-weight:800;font-size:1.4rem}
.tile:disabled{opacity:.25}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px}
.slot{width:40px;height:48px;border-bottom:3px solid var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem}
.slot.gap{border:none;width:16px}
input[type=text]{font:inherit;font-size:1.3rem;font-weight:700;width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.m{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-weight:700;min-height:48px;overflow-wrap:anywhere}
.m.sel{border-color:var(--accent);background:var(--accent-soft)}
.m.ok{border-color:var(--ok);background:var(--ok-soft);opacity:.55}
.m.bad{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.fs{display:flex;flex-direction:column;gap:8px}
.fs h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--display);font-size:3rem;font-weight:800;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.list{display:flex;flex-wrap:wrap;gap:6px}
.list span{background:var(--bad-soft);border-radius:8px;padding:2px 8px;font-weight:700;font-size:.9rem}
.words{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:0}
.words div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.95rem}
.words div b{font-weight:800}
.words div span{color:var(--muted);text-align:right}
@media (max-width:520px){.words{grid-template-columns:1fr}}
.upd{background:var(--sun-soft);border:2px solid var(--sun);border-radius:16px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.upd p{margin:0;flex:1 1 220px;font-weight:700}
.upd .row{justify-content:flex-start}
.news{flex:1 1 100%;display:flex;flex-direction:column;gap:6px}
.news h3{margin:0;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.news b{font-family:var(--display);font-size:1.05rem}
.news ul{margin:2px 0 0;padding-left:22px}
@media (prefers-reduced-motion:reduce){.flash .in,.bar i{transition:none}}
</style>

const app=document.getElementById("app"), rail=document.getElementById("rail"), pick=document.getElementById("pick");
const STEPS=[["Kartičky","Spoznaj"],["Vyber","EN → SK"],["Počúvaj","a vyber"],["Spájaj","páry"],["Poskladaj","z písmen"],["Napíš","po anglicky"]];
let tab="new", step=0, done=new Set(), learnUnits=new Set([1]);
// Words of the 3rd-grade units picked in the "3. ročník" tab
const NEW=()=>[...learnUnits].sort((a,b)=>a-b).flatMap(u=>G3[u]);
const BIG=30, SAMPLE=20;

function unitChips(units,names,onChange){
  const all=Object.keys(names).map(Number), box=$("div",{class:"chips"});
  box.append($("button",{class:"chip","aria-pressed":units.size===all.length,onclick:()=>{const on=units.size===all.length;units.clear();if(!on)all.forEach(u=>units.add(u));onChange()}},"Všetky"));
  all.forEach(u=>box.append($("button",{class:"chip","aria-pressed":units.has(u),title:names[u],onclick:()=>{units.has(u)?units.delete(u):units.add(u);onChange()}},"Unit "+u)));
  return box;
}
function drawPick(){
  pick.hidden = tab!=="new"; pick.innerHTML="";
  if(tab!=="new") return;
  const n=NEW().length, one=learnUnits.size===1?[...learnUnits][0]:0;
  pick.append($("h3",{},"Unity 3. ročníka"+(one?" · "+UN3[one]:"")+(n?" · "+n+" slovíčok":"")),
    unitChips(learnUnits,UN3,()=>{step=0;done.clear();render()}));
}
function drawRail(){
  rail.hidden = tab!=="new"||!learnUnits.size; rail.innerHTML="";
  STEPS.forEach((s,i)=>rail.append($("button",{class:"st"+(i===step?" on":"")+(done.has(i)?" done":""),onclick:()=>{step=i;render()}},$("b",{},String(i+1)),s[0])));
}
function render(){
  [["t-new","new"],["t-rev3","rev3"],["t-rev","rev"]].forEach(([id,t])=>document.getElementById(id).setAttribute("aria-selected",tab===t));
  drawPick(); drawRail(); app.innerHTML="";
  if(tab==="rev") return reviewSetup(2);
  if(tab==="rev3") return reviewSetup(3);
  if(!learnUnits.size) return app.append($("section",{class:"card"},$("p",{class:"fb bad"},"Vyber aspoň jeden Unit.")));
  const next=()=>{done.add(step);if(step<5){step++;render();window.scrollTo({top:0})}else finale()};
  const all=NEW(), pool=all.length>BIG?shuffle(all).slice(0,SAMPLE):all;
  const h=t=>pool.length<all.length?t+" Vybraných je veľa slovíčok, preto je tu náhodne "+SAMPLE+" z nich.":t;
  [cards,()=>quiz("choose","en-sk",pool,all,next,"Vyber správny preklad",h("Prečítaj si anglické slovo a vyber, čo znamená po slovensky.")),
   ()=>quiz("listen","en-sk",pool,all,next,"Počúvaj a vyber",h("Stlač reproduktor, vypočuj si slovo a vyber správny preklad.")),
   ()=>match(pool,next),
   ()=>quiz("spell","sk-en",pool,all,next,"Poskladaj slovo",h("Poskladaj anglické slovo z písmen.")),
   ()=>quiz("write","sk-en",pool,all,next,"Napíš po anglicky",h("Napíš anglické slovo. Pomôcka ukáže prvé písmeno."))][step](next);
}
document.getElementById("t-new").onclick=()=>{tab="new";render()};
document.getElementById("t-rev3").onclick=()=>{tab="rev3";render()};
document.getElementById("t-rev").onclick=()=>{tab="rev";render()};

function cards(next){
  const W=NEW(); let i=0, rev=false;
  const c=$("section",{class:"card"});app.append(c);
  const draw=()=>{
    const w=W[i]; c.innerHTML="";
    const front=rev?w.sk:w.en, back=rev?w.en:w.sk;
    const fl=$("button",{class:"flash","aria-label":"Otočiť kartičku",onclick:()=>{fl.classList.toggle("flip");if(!rev&&!fl.classList.contains("flip"))speak(w.en);if(rev&&fl.classList.contains("flip"))speak(w.en)}},
      $("div",{class:"in"},$("div",{class:"face f"},$("small",{},rev?"po slovensky":"po anglicky"),front),$("div",{class:"face b"},$("small",{},rev?"po anglicky":"po slovensky"),back)));
    c.append($("h2",{},"Kartičky"),$("p",{class:"hint"},"Ťukni na kartičku, otočí sa. Najprv sa skús rozpamätať sám."),
      $("div",{class:"meta"},$("span",{},"Unit "+w.u+" · Lesson "+w.l),$("span",{},(i+1)+" / "+W.length)),
      $("div",{class:"bar"},$("i",{style:"width:"+((i+1)/W.length*100)+"%"})),fl,
      $("div",{class:"row"},
        $("button",{class:"btn ghost",onclick:()=>{i=(i+W.length-1)%W.length;draw()}},"◀ Späť"),
        $("button",{class:"btn ghost",onclick:()=>speak(w.en)},spkIcon(),"Vypočuj"),
        $("button",{class:"btn ghost",onclick:()=>{rev=!rev;draw()}},rev?"Začínať po anglicky":"Začínať po slovensky"),
        $("button",{class:"btn",onclick:()=>{i=(i+1)%W.length;draw()}},"Ďalej ▶")),
      $("div",{class:"row"},$("button",{class:"btn sun",onclick:next},"Viem ich, ďalší krok")));
  };
  draw();
  const all=$("section",{class:"card"},$("h2",{},"Vybrané slovíčka"));
  [...learnUnits].sort((a,b)=>a-b).forEach(u=>all.append($("div",{class:"fs"},$("h3",{},"Unit "+u+" · "+UN3[u]),$("div",{class:"words"},G3[u].map(w=>$("div",{},$("b",{},w.en),$("span",{},w.sk)))))));
  app.append(all);
}

function quiz(kind,dir,pool,distractPool,onDone,title,hint,reviewMode){
  let queue=shuffle(pool).map(w=>({w,tries:0})), total=queue.length, firstOk=0, doneN=0, wrong=[];
  const c=$("section",{class:"card"});app.append(c);
  const show=()=>{
    if(!queue.length) return result();
    const it=queue[0], w=it.w; c.innerHTML="";
    c.append($("h2",{},title),$("p",{class:"hint"},hint),
      $("div",{class:"meta"},$("span",{},"Správne na prvý pokus: "+firstOk),$("span",{},doneN+" / "+total)),
      $("div",{class:"bar"},$("i",{style:"width:"+(doneN/total*100)+"%"})));
    const box=$("div",{class:"fs"});c.append(box);
    const answered=(ok,correctText)=>{
      it.tries++;
      if(ok){ if(it.tries===1)firstOk++; doneN++; queue.shift(); }
      else { if(!wrong.includes(w))wrong.push(w); queue.shift(); if(it.tries<3)queue.push(it); else doneN++; }
      speak(w.en);
      const fb=ok?$("div",{class:"fb ok"},"Výborne! ",$("span",{},w.en+" = "+w.sk))
                 :$("div",{class:"fb bad"},"Ešte nie. Správne: ",$("span",{},w.en+" = "+w.sk));
      const nb=$("button",{class:"btn",onclick:show},"Ďalej ▶");
      c.append(fb,$("div",{class:"row"},nb)); nb.focus();
    };
    if(kind==="choose"||kind==="listen"){
      const ask=dir==="en-sk"?w.en:w.sk, key=dir==="en-sk"?"sk":"en";
      if(kind==="listen"&&canSpeak){
        box.append($("span",{class:"lbl"},"Stlač a vypočuj si slovo"),$("button",{class:"speak",onclick:()=>speak(w.en)},spkIcon(),"Prehrať slovo"));
        setTimeout(()=>speak(w.en),250);
      } else {
        box.append($("span",{class:"lbl"},dir==="en-sk"?"po anglicky":"po slovensky"),$("div",{class:"prompt"},ask));
        if(kind==="listen") box.append($("p",{class:"hint",style:"text-align:center"},"Tento prehliadač nevie čítať nahlas, preto je slovo napísané."));
      }
      const seen=new Set([w[key]]), others=shuffle(distractPool.filter(x=>x.en!==w.en&&x.sk!==w.sk)).filter(x=>!seen.has(x[key])&&seen.add(x[key])).slice(0,3);
      const opts=$("div",{class:"opts"});
      shuffle([w,...others]).forEach(o=>{
        const b=$("button",{class:"opt",onclick:()=>{
          opts.querySelectorAll("button").forEach(x=>{x.disabled=true;if(x.textContent===w[key])x.classList.add("ok")});
          if(o!==w)b.classList.add("bad"); answered(o===w);
        }},o[key]); opts.append(b);
      });
      box.append(opts);
    }
    if(kind==="spell"){
      box.append($("span",{class:"lbl"},"po slovensky"),$("div",{class:"prompt"},w.sk));
      const letters=[...w.en].filter(ch=>ch!==" ");
      const slots=$("div",{class:"slots"}), tiles=$("div",{class:"tiles"}); let picked=[];
      const drawSlots=()=>{slots.innerHTML="";let k=0;[...w.en].forEach(ch=>{if(ch===" ")slots.append($("div",{class:"slot gap"}));else slots.append($("div",{class:"slot"},picked[k++]?.ch||""))})};
      shuffle(letters.map((ch,i)=>({ch,i}))).forEach(t=>{
        const b=$("button",{class:"tile",onclick:()=>{picked.push({ch:t.ch,b});b.disabled=true;drawSlots();
          if(picked.length===letters.length){tiles.querySelectorAll("button").forEach(x=>x.disabled=true);undo.disabled=true;answered(picked.map(p=>p.ch).join("")===letters.join(""))}}},t.ch);
        tiles.append(b);
      });
      const undo=$("button",{class:"btn ghost",onclick:()=>{const p=picked.pop();if(p){p.b.disabled=false;drawSlots()}}},"⌫ Späť");
      drawSlots(); box.append(slots,tiles,$("div",{class:"row"},undo));
    }
    if(kind==="write"){
      box.append($("span",{class:"lbl"},"po slovensky"),$("div",{class:"prompt"},w.sk));
      const inp=$("input",{type:"text",id:"wr",autocomplete:"off",autocapitalize:"off",spellcheck:"false","aria-label":"Napíš po anglicky"});
      let hinted=0;
      const check=()=>{if(!inp.value.trim())return;inp.disabled=true;ok.disabled=true;hb.disabled=true;answered(norm(inp.value)===norm(w.en)||norm(inp.value)===norm(w.en.replace(/^I'm /,"I am ")))};
      inp.addEventListener("keydown",e=>{if(e.key==="Enter")check()});
      const ok=$("button",{class:"btn",onclick:check},"Skontrolovať");
      const hb=$("button",{class:"btn ghost",onclick:()=>{hinted++;inp.placeholder=w.en.slice(0,hinted)+"…"+" ("+w.en.length+" znakov)";inp.focus()}},"Pomôcka");
      box.append(inp,$("div",{class:"row"},hb,ok)); setTimeout(()=>inp.focus(),50);
    }
  };
  const result=()=>{
    c.innerHTML="";
    const pct=Math.round(firstOk/total*100);
    c.append($("h2",{},"Hotovo!"),$("div",{class:"big"},firstOk+" / "+total),
      $("p",{class:"hint",style:"text-align:center"},pct>=90?"Super, toto už vieš!":pct>=60?"Dobre! Chybné slovíčka si ešte zopakuj.":"Skús to ešte raz, pôjde to lepšie."));
    if(wrong.length) c.append($("div",{class:"fs"},$("h3",{},"Tieto slovíčka si zopakuj"),$("div",{class:"list"},wrong.map(w=>$("span",{},w.en+" – "+w.sk)))));
    c.append($("div",{class:"row"},
      $("button",{class:"btn ghost",onclick:()=>{app.innerHTML="";quiz(kind,dir,pool,distractPool,onDone,title,hint,reviewMode)}},"Ešte raz"),
      wrong.length?$("button",{class:"btn ghost",onclick:()=>{app.innerHTML="";quiz(kind,dir,wrong,distractPool,onDone,title,hint,reviewMode)}},"Len chyby"):null,
      $("button",{class:"btn sun",onclick:onDone},reviewMode?"Späť na výber":"Ďalší krok ▶")));
  };
  show();
}

function match(pool,onDone){
  const rounds=[], sh=shuffle(pool); for(let i=0;i<sh.length;i+=7)rounds.push(sh.slice(i,i+7));
  let r=0, mistakes=0;
  const c=$("section",{class:"card"});app.append(c);
  const play=()=>{
    if(r>=rounds.length){c.innerHTML="";c.append($("h2",{},"Hotovo!"),$("div",{class:"big"},mistakes===0?"Bez chyby":mistakes+" chýb"),$("div",{class:"row"},$("button",{class:"btn ghost",onclick:()=>{r=0;mistakes=0;play()}},"Ešte raz"),$("button",{class:"btn sun",onclick:onDone},"Ďalší krok ▶")));return}
    const set=rounds[r]; let selL=null, left=set.length;
    c.innerHTML="";
    c.append($("h2",{},"Spájaj páry"),$("p",{class:"hint"},"Ťukni na anglické slovo a potom na jeho slovenský preklad."),
      $("div",{class:"meta"},$("span",{},"Kolo "+(r+1)+" / "+rounds.length),$("span",{},"Chyby: "+mistakes)));
    const L=$("div",{class:"col"}),R=$("div",{class:"col"});
    shuffle(set).forEach(w=>{const b=$("button",{class:"m",onclick:()=>{if(b.disabled)return;L.querySelectorAll(".m").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selL={w,b};speak(w.en)}},w.en);L.append(b)});
    shuffle(set).forEach(w=>{const b=$("button",{class:"m",onclick:()=>{
      if(!selL||b.disabled)return;
      if(selL.w===w){[selL.b,b].forEach(x=>{x.classList.remove("sel");x.classList.add("ok");x.disabled=true});selL=null;if(--left===0){r++;setTimeout(play,600)}}
      else{mistakes++;b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),500);c.querySelector(".meta span:last-child").textContent="Chyby: "+mistakes}
    }},w.sk);R.append(b)});
    c.append($("div",{class:"match"},L,R));
  };
  play();
}

function finale(){
  app.innerHTML="";drawRail();
  const us=[...learnUnits], nu=us.length===1&&us[0]<10?us[0]+1:0;
  app.append($("section",{class:"card"},$("h2",{},"Prešiel si všetkých 6 krokov!"),
    $("p",{class:"hint"},"Nové slovíčka si teraz upevni opakovaním. Zajtra skús hneď krok 6 Napíš, či si ich ešte pamätáš."),
    $("div",{class:"row"},$("button",{class:"btn ghost",onclick:()=>{step=0;done.clear();render()}},"Začať odznova"),
      nu?$("button",{class:"btn ghost",onclick:()=>{learnUnits=new Set([nu]);step=0;done.clear();render();window.scrollTo({top:0})}},"Unit "+nu+" ▶"):null,
      $("button",{class:"btn sun",onclick:()=>{tab="rev3";render()}},"Opakovanie 3. ročníka ▶"))));
}

// Review settings, kept separately for each grade
const REV={2:{units:new Set(Object.keys(G2).map(Number)),mode:"choose-en",count:15,mix:true},
           3:{units:new Set(Object.keys(G3).map(Number)),mode:"choose-en",count:15,mix:false}};
function reviewSetup(g){
  const R=REV[g], G=g===2?G2:G3, N=g===2?UN2:UN3;
  const c=$("section",{class:"card"});app.append(c);
  const units=unitChips(R.units,N,()=>{app.innerHTML="";reviewSetup(g)});
  const modes=[["choose-en","Vyber: EN → SK"],["choose-sk","Vyber: SK → EN"],["listen","Počúvaj a vyber"],["spell","Poskladaj z písmen"],["write","Napíš po anglicky"]];
  const mc=$("div",{class:"chips"});
  modes.forEach(([k,t])=>mc.append($("button",{class:"chip","aria-pressed":R.mode===k,onclick:e=>{R.mode=k;mc.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===e.currentTarget))}},t)));
  const cc=$("div",{class:"chips"});
  [10,15,25,0].forEach(n=>cc.append($("button",{class:"chip","aria-pressed":R.count===n,onclick:e=>{R.count=n;cc.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===e.currentTarget))}},n?n+" slov":"Všetky")));
  const extra=g===2?NEW():Object.values(G2).flat();
  const nc=$("button",{class:"chip","aria-pressed":R.mix,onclick:e=>{R.mix=!R.mix;e.currentTarget.setAttribute("aria-pressed",R.mix)}},
    g===2?"Primiešať aj slovíčka z 3. ročníka (unity vybrané v karte 3. ročník)":"Primiešať aj slovíčka z 2. ročníka");
  const err=$("p",{class:"fb bad",hidden:""},"Vyber aspoň jeden Unit.");
  c.append($("h2",{},"Opakovanie "+g+". ročníka"),$("p",{class:"hint"},"Vyber unity a spôsob opakovania. Slovíčka sa vyberú náhodne."),
    $("div",{class:"fs"},$("h3",{},"Unity"),units),
    $("div",{class:"fs"},$("h3",{},"Spôsob"),mc),
    $("div",{class:"fs"},$("h3",{},"Počet"),cc),
    $("div",{class:"fs"},$("h3",{},"Navyše"),$("div",{class:"chips"},nc)),
    err,
    $("div",{class:"row"},$("button",{class:"btn sun",onclick:()=>{
      if(!R.units.size){err.hidden=false;return}
      const pool=[...R.units].flatMap(u=>G[u]), n=R.count||pool.length, mix=R.mix&&extra.length;
      let pick=shuffle(pool).slice(0,n);
      if(mix){const k=Math.max(2,Math.round(n/5));pick=shuffle([...pick.slice(0,n-k),...shuffle(extra).slice(0,k)]);}
      const dist=mix?[...pool,...extra]:pool;
      app.innerHTML="";
      const back=()=>{app.innerHTML="";reviewSetup(g);window.scrollTo({top:0})};
      const map={"choose-en":["choose","en-sk","Vyber správny preklad","Vyber, čo slovo znamená po slovensky."],
        "choose-sk":["choose","sk-en","Vyber anglické slovo","Vyber správne anglické slovo."],
        "listen":["listen","en-sk","Počúvaj a vyber","Vypočuj si slovo a vyber preklad."],
        "spell":["spell","sk-en","Poskladaj slovo","Poskladaj anglické slovo z písmen."],
        "write":["write","sk-en","Napíš po anglicky","Napíš anglické slovo. Pomôcka ukáže prvé písmená."]}[R.mode];
      quiz(map[0],map[1],pick,dist,back,map[2],map[3],true);
    }},"Začať opakovanie ▶")));
  const lc=$("section",{class:"card"},$("h2",{},"Slovníček "+g+". ročníka"));
  Object.keys(G).forEach(u=>lc.append($("div",{class:"fs"},$("h3",{},"Unit "+u+" · "+N[u]),$("div",{class:"words"},G[u].map(w=>$("div",{},$("b",{},w.en),$("span",{},w.sk)))))));
  app.append(lc);
}

render();

<script>
// Offline support: the service worker keeps a copy of the app on the phone.
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{}));

// Update check: compare this copy's version with the online version.js; offer an update when the online one is newer.
const VERSION=self.APP_VERSION||"";
document.getElementById("ver").textContent=VERSION?"verzia "+VERSION:"";
const newer=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
let updLater=false;
async function checkUpdate(){
  if(!VERSION||updLater||!navigator.onLine) return;
  try{
    const r=await fetch("version.js?check="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    // Run the online copy of our own version.js against a plain object to read its version and changelog
    const o={}; new Function("self",await r.text())(o);
    if(o.APP_VERSION&&newer(o.APP_VERSION,VERSION)) showUpdate(o.APP_VERSION,(o.CHANGELOG||[]).filter(e=>newer(e.version,VERSION)));
  }catch(e){}
}
function showUpdate(online,changes){
  const box=document.getElementById("upd"); box.innerHTML="";
  const go=$("button",{class:"btn sun",onclick:async()=>{
    go.disabled=true; go.textContent="Aktualizujem…";
    try{
      const reg=await navigator.serviceWorker?.getRegistration();
      if(reg){
        await reg.update();
        const sw=reg.installing||reg.waiting;
        if(sw) await new Promise(ok=>{const t=setTimeout(ok,15000);sw.addEventListener("statechange",()=>{if(sw.state==="activated"||sw.state==="redundant"){clearTimeout(t);ok()}})});
      }
    }catch(e){}
    location.reload();
  }},"Aktualizovať");
  box.append($("p",{},"Je dostupná nová verzia "+online+" (máš "+VERSION+")."));
  if(changes.length) box.append($("div",{class:"news"},$("h3",{},"Čo je nové"),
    changes.map(e=>$("div",{},$("b",{},"Verzia "+e.version),$("ul",{},e.changes.map(t=>$("li",{},t)))))));
  box.append($("div",{class:"row"},go,$("button",{class:"btn ghost",onclick:()=>{updLater=true;box.hidden=true}},"Neskôr")));
  box.hidden=false;
}
addEventListener("load",checkUpdate);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")checkUpdate()});
</script>
